name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: techstore
          POSTGRES_PASSWORD: techstore
          POSTGRES_DB: techstore
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U techstore" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://techstore:techstore@localhost:5432/techstore
      SESSION_SECRET: ci-session-secret-ci-session-secret-1234
      PAYMENT_WEBHOOK_SECRET: ci-webhook-secret-ci-webhook-secret-12345678
      CRON_SECRET: ci-cron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/techstore
            git pull --ff-only
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
            docker image prune -f
