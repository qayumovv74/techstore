# Продакшен на одном VPS: база, сайт, Caddy (HTTPS от Let's Encrypt сам), бэкапы и снятие резервов.
# Запуск: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: techstore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}
      POSTGRES_DB: techstore
      # пароль роли сайта (techstore_app): создаётся при первом запуске базы
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?задайте APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techstore"]
      interval: 5s
      retries: 10

  app:
    # готовый образ из GitHub (собирает CI); без него — сборка здесь: up -d --build
    image: ${APP_IMAGE:-ghcr.io/qayumovv74/techstore:latest}
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      # сайт — под ролью без права менять схему; миграции при старте — от владельца базы
      DATABASE_URL: postgres://techstore_app:${APP_DB_PASSWORD}@postgres:5432/techstore
      MIGRATION_DATABASE_URL: postgres://techstore:${POSTGRES_PASSWORD}@postgres:5432/techstore
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

  # каждые 5 минут снимаем резерв с неоплаченных заказов
  cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    entrypoint: ["sh", "-c", "while true; do curl -fsS -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron/release; sleep 300; done"]
    environment:
      CRON_SECRET: ${CRON_SECRET}
    depends_on:
      - app

  # ежедневный дамп базы, хранится 14 дней
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          pg_dump -h postgres -U techstore -Fc techstore > /backups/techstore-$$(date +%F).dump
          find /backups -name '*.dump' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  caddy_data:
